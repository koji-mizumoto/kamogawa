<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Pista Resort 収支シミュレーター</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --navy: #1a2744;
  --navy-light: #2a3f6a;
  --navy-dark: #0e1a30;
  --white: #ffffff;
  --gray-50: #f8f9fc;
  --gray-100: #eef1f6;
  --gray-200: #dde2ec;
  --gray-300: #b8c1d4;
  --gray-500: #6b7a94;
  --gray-700: #374a6b;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --orange: #f59e0b;
  --orange-bg: #fffbeb;
  --pet-color: #8b5cf6;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --radius: 8px;
  --radius-lg: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background:var(--gray-50); color:var(--navy); line-height:1.5; }
.header { background:linear-gradient(135deg,var(--navy),var(--navy-light)); color:var(--white); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-lg); }
.header h1 { font-size:18px; font-weight:700; letter-spacing:.5px; }
.header-sub { font-size:12px; opacity:.7; }
.header-actions { display:flex; gap:8px; flex-wrap:wrap; }
.btn { padding:8px 16px; border:none; border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background:var(--accent); color:var(--white); }
.btn-primary:hover { background:var(--accent-light); }
.btn-outline { background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.4); }
.btn-outline:hover { background:rgba(255,255,255,.1); }
.btn-preset { padding:6px 12px; font-size:12px; border-radius:20px; }
.btn-preset.active { background:var(--white); color:var(--navy); }
.container { max-width:1400px; margin:0 auto; padding:20px; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.kpi-card { background:var(--white); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow); border-left:4px solid var(--accent); }
.kpi-card.green { border-left-color:var(--green); }
.kpi-card.red { border-left-color:var(--red); }
.kpi-card.orange { border-left-color:var(--orange); }
.kpi-card.purple { border-left-color:var(--pet-color); }
.kpi-label { font-size:12px; color:var(--gray-500); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
.kpi-value { font-size:24px; font-weight:700; }
.kpi-sub { font-size:11px; color:var(--gray-500); margin-top:4px; }
.section { background:var(--white); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); margin-bottom:20px; }
.section-title { font-size:16px; font-weight:700; margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid var(--gray-100); }
.tabs { display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap; border-bottom:2px solid var(--gray-100); padding-bottom:0; }
.tab { padding:10px 20px; cursor:pointer; font-size:13px; font-weight:600; color:var(--gray-500); border:none; background:none; border-bottom:3px solid transparent; transition:all .2s; margin-bottom:-2px; }
.tab:hover { color:var(--navy); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-content { display:none; }
.tab-content.active { display:block; }
.scenario-table { width:100%; border-collapse:collapse; font-size:13px; }
.scenario-table th, .scenario-table td { padding:10px 14px; text-align:right; border-bottom:1px solid var(--gray-100); }
.scenario-table th { background:var(--gray-50); font-weight:600; color:var(--gray-700); text-align:left; }
.scenario-table th:not(:first-child) { text-align:right; }
.scenario-table td:first-child { text-align:left; font-weight:500; }
.scenario-table .highlight { background:var(--green-bg); }
.scenario-table .negative { color:var(--red); }
.scenario-table .positive { color:var(--green); }
.chart-container { position:relative; height:350px; margin:12px 0; }
.chart-half { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.chart-half .chart-container { height:300px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; overflow-y:auto; }
.modal-overlay.open { display:flex; align-items:flex-start; justify-content:center; padding:20px; }
.modal { background:var(--white); border-radius:var(--radius-lg); width:100%; max-width:1000px; margin:20px auto; box-shadow:var(--shadow-lg); max-height:90vh; display:flex; flex-direction:column; }
.modal-header { padding:20px 24px; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.modal-header h2 { font-size:18px; }
.modal-close { width:36px; height:36px; border:none; background:var(--gray-100); border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
.modal-close:hover { background:var(--gray-200); }
.modal-body { padding:0; overflow-y:auto; flex:1; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--gray-200); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0; }
.settings-tabs { display:flex; border-bottom:1px solid var(--gray-200); background:var(--gray-50); flex-wrap:wrap; }
.settings-tab { padding:12px 20px; font-size:13px; font-weight:600; color:var(--gray-500); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; }
.settings-tab:hover { color:var(--navy); }
.settings-tab.active { color:var(--accent); border-bottom-color:var(--accent); background:var(--white); }
.settings-panel { display:none; padding:24px; }
.settings-panel.active { display:block; }
.form-group { margin-bottom:16px; }
.form-label { font-size:12px; font-weight:600; color:var(--gray-700); margin-bottom:4px; display:block; }
.form-input { width:100%; padding:8px 12px; border:1px solid var(--gray-200); border-radius:var(--radius); font-size:13px; transition:border-color .2s; }
.form-input:focus { outline:none; border-color:var(--accent); }
.form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
.form-section { margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--gray-100); }
.form-section-title { font-size:14px; font-weight:700; margin-bottom:12px; color:var(--navy); }
.room-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.room-card { border:1px solid var(--gray-200); border-radius:var(--radius); padding:16px; }
.room-card h4 { font-size:13px; font-weight:700; margin-bottom:8px; }
.room-card.pet { border-color:var(--pet-color); border-width:2px; }
.room-card .form-row { grid-template-columns:1fr 1fr; }
.bulk-adjust { background:var(--gray-50); border-radius:var(--radius); padding:16px; margin-bottom:20px; }
.bulk-adjust h4 { font-size:13px; font-weight:700; margin-bottom:10px; }
.checkbox-grid { display:flex; flex-wrap:wrap; gap:8px; }
.checkbox-label { display:flex; align-items:center; gap:4px; font-size:13px; padding:4px 10px; border:1px solid var(--gray-200); border-radius:20px; cursor:pointer; }
.checkbox-label input { accent-color:var(--accent); }
.checkbox-label:has(input:checked) { background:var(--accent); color:var(--white); border-color:var(--accent); }
.expense-table { width:100%; font-size:12px; border-collapse:collapse; }
.expense-table th, .expense-table td { padding:6px 10px; border-bottom:1px solid var(--gray-100); }
.expense-table th { text-align:left; font-weight:600; background:var(--gray-50); }
.expense-table td:last-child { text-align:right; }
.expense-table input { width:100px; text-align:right; }
.detail-table { width:100%; border-collapse:collapse; font-size:12px; overflow-x:auto; display:block; }
.detail-table th, .detail-table td { padding:8px 10px; border:1px solid var(--gray-200); white-space:nowrap; }
.detail-table th { background:var(--gray-50); font-weight:600; text-align:center; position:sticky; top:0; }
.detail-table td { text-align:right; }
.detail-table td:first-child { text-align:left; font-weight:500; }
.revpar-table { width:100%; border-collapse:collapse; font-size:13px; }
.revpar-table th, .revpar-table td { padding:10px 14px; border-bottom:1px solid var(--gray-100); }
.revpar-table th { text-align:left; background:var(--gray-50); font-weight:600; }
.revpar-table td { text-align:right; }
.revpar-table td:first-child { text-align:left; }
.negative-val { color:var(--red); }
.positive-val { color:var(--green); }
@media(max-width:768px) {
  .header h1 { font-size:14px; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .kpi-value { font-size:18px; }
  .chart-half { grid-template-columns:1fr; }
  .container { padding:12px; }
  .section { padding:16px; }
  .modal { max-height:100vh; border-radius:0; margin:0; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>La Pista Resort 収支シミュレーター</h1>
    <div class="header-sub">ペット同伴リニューアル事業計画 | 全43室（一般20室 + ペット23室）| 1泊2食付</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-preset btn-outline" onclick="applyPreset('conservative')">保守</button>
    <button class="btn btn-preset btn-outline active" onclick="applyPreset('neutral')">中立</button>
    <button class="btn btn-preset btn-outline" onclick="applyPreset('optimistic')">楽観</button>
    <button class="btn btn-primary" onclick="openSettings()">設定</button>
  </div>
</div>

<div class="container">
  <!-- KPI Dashboard -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- 3-Scenario Comparison -->
  <div class="section">
    <div class="section-title">3シナリオ比較</div>
    <div style="overflow-x:auto">
      <table class="scenario-table" id="scenarioTable"></table>
    </div>
  </div>

  <!-- Main Tabs -->
  <div class="tabs" id="mainTabs">
    <button class="tab active" data-tab="overview">10年間累積収支</button>
    <button class="tab" data-tab="monthly">月次収支推移</button>
    <button class="tab" data-tab="roomBreak">客室タイプ別収益</button>
    <button class="tab" data-tab="expenseBreak">経費内訳</button>
    <button class="tab" data-tab="plTable">年次損益計算書</button>
    <button class="tab" data-tab="revpar">ルームタイプ別RevPAR</button>
    <button class="tab" data-tab="monthlyDetail">月別稼働率・単価一覧</button>
  </div>

  <div id="tabContents">
    <div class="tab-content active" id="tab-overview">
      <div class="section">
        <div class="section-title">10年間累積収支グラフ</div>
        <div class="chart-container"><canvas id="chartCumulative"></canvas></div>
      </div>
    </div>
    <div class="tab-content" id="tab-monthly">
      <div class="section">
        <div class="section-title">月次収支推移（1年目）</div>
        <div class="chart-container"><canvas id="chartMonthly"></canvas></div>
      </div>
    </div>
    <div class="tab-content" id="tab-roomBreak">
      <div class="section">
        <div class="section-title">客室タイプ別年間収益内訳</div>
        <div class="chart-half">
          <div class="chart-container"><canvas id="chartRoomRevenue"></canvas></div>
          <div class="chart-container"><canvas id="chartRoomCompare"></canvas></div>
        </div>
      </div>
    </div>
    <div class="tab-content" id="tab-expenseBreak">
      <div class="section">
        <div class="section-title">経費内訳</div>
        <div class="chart-half">
          <div class="chart-container"><canvas id="chartExpensePie"></canvas></div>
          <div class="chart-container"><canvas id="chartExpenseBar"></canvas></div>
        </div>
      </div>
    </div>
    <div class="tab-content" id="tab-plTable">
      <div class="section">
        <div class="section-title">年次別損益計算書</div>
        <div style="overflow-x:auto"><table class="detail-table" id="plTableBody"></table></div>
      </div>
    </div>
    <div class="tab-content" id="tab-revpar">
      <div class="section">
        <div class="section-title">ルームタイプ別RevPAR一覧</div>
        <table class="revpar-table" id="revparTable"></table>
      </div>
    </div>
    <div class="tab-content" id="tab-monthlyDetail">
      <div class="section">
        <div class="section-title">月別稼働率・単価一覧</div>
        <div style="overflow-x:auto"><table class="detail-table" id="monthlyDetailTable"></table></div>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>シミュレーション設定</h2>
      <button class="modal-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="settings-tabs" id="settingsTabs">
      <button class="settings-tab active" data-stab="rooms">客室設定</button>
      <button class="settings-tab" data-stab="ancillary">付帯収入</button>
      <button class="settings-tab" data-stab="expenses">経費設定</button>
      <button class="settings-tab" data-stab="personnel">人件費</button>
      <button class="settings-tab" data-stab="simcond">シミュレーション条件</button>
    </div>
    <div class="modal-body">
      <div class="settings-panel active" id="stab-rooms"></div>
      <div class="settings-panel" id="stab-ancillary"></div>
      <div class="settings-panel" id="stab-expenses"></div>
      <div class="settings-panel" id="stab-personnel"></div>
      <div class="settings-panel" id="stab-simcond"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="color:var(--navy);border-color:var(--gray-300)" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="applySettings()">反映</button>
    </div>
  </div>
</div>

<script>
// ===== DATA MODEL =====
const DEFAULT = {
  generalRooms: [
    { id:'gen_standard', name:'一般スタンダード', count:16, normalADR:60000, peakADR:90000, normalOcc:0.42, peakOcc:0.55 },
    { id:'gen_suite', name:'一般スイート', count:4, normalADR:100000, peakADR:150000, normalOcc:0.40, peakOcc:0.52 }
  ],
  petRooms: [
    { id:'pet_standard', name:'ペットスタンダード', count:21, normalADR:60000, peakADR:90000, petFee:990, petFee2:3300, normalOcc:0.52, peakOcc:0.65 },
    { id:'pet_suite', name:'ペットスイート', count:2, normalADR:120000, peakADR:180000, petFee:990, petFee2:3300, normalOcc:0.50, peakOcc:0.62 }
  ],
  ancillary: {
    avgGuestsGen:2.2, avgGuestsPet:2.0,
    drinkOrderRate:0.60, drinkPrice:2500,
    petPremiumPlate:1650, petPremiumRate:0.30,
    petCake:1500, petCakeRate:0.10,
    shopMonthly:200000,
    otherMonthly:217000
  },
  expenses: {
    foodCostPerGuest:5883, bevCostRate:0.30,
    linenUnitGen:3000, linenUnitPet:3800,
    amenityUnit:2000,
    otaCommRate:0.084837,
    petRelated:1000000,
    utilities:4125000,
    adMarketing:1100000,
    repair:1100000,
    insuranceAll:400000,
    generalFixed:400000,
    propertyTax:1400000
  },
  personnel: {
    departments: [
      { name:'総支配人・副支配人', ft:2, pt:0, salary:500000 },
      { name:'フロント・コンシェルジュ', ft:6, pt:2, salary:310000 },
      { name:'予約・管理部門', ft:2, pt:1, salary:330000 },
      { name:'HK 一般棟', ft:3, pt:3, salary:260000 },
      { name:'HK ペット棟', ft:2, pt:3, salary:265000 },
      { name:'キッチン', ft:5, pt:3, salary:310000 },
      { name:'レストランホール', ft:3, pt:5, salary:275000 },
      { name:'施設管理', ft:3, pt:0, salary:290000 },
      { name:'ペットコンシェルジュ', ft:2, pt:0, salary:300000 },
      { name:'ペット専用清掃', ft:1, pt:2, salary:250000 },
      { name:'マーケティング', ft:1, pt:0, salary:350000 }
    ],
    ptHourly:1200, ptHours:126,
    socialRate:0.15, bonusMonths:3.0, allowanceRate:0.057
  },
  simCond: {
    years:10,
    peakMonths:[3,5,7,8,9,12],
    occGrowth:1.0, adrGrowth:1.5, expGrowth:2.0,
    totalInvestment:585000000,
    loanAmount:409500000, loanRate:1.8, loanYears:20
  }
};

let S = JSON.parse(JSON.stringify(DEFAULT));
let charts = {};

// ===== CALCULATION ENGINE =====
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
// Monthly OCC multipliers: target annual avg Gen=49.6%, Pet=60.0%
// Jan35%,Feb35%,Mar50%,Apr45%,May65%,Jun35%,Jul65%,Aug80%,Sep50%,Oct45%,Nov40%,Dec50%
const OCC_PATTERN_GEN = [0.833,0.833,1.190,0.818,1.182,0.833,1.182,1.455,1.190,0.909,0.952,0.952];
// Jan45%,Feb45%,Mar60%,Apr55%,May75%,Jun50%,Jul75%,Aug90%,Sep60%,Oct55%,Nov50%,Dec60%
const OCC_PATTERN_PET = [0.865,0.865,1.154,0.846,1.154,0.962,1.154,1.385,1.154,0.962,0.962,0.962];

function isPeak(m) { return S.simCond.peakMonths.includes(m+1); }

function calcMonthlyLoan() {
  const P = S.simCond.loanAmount;
  const r = S.simCond.loanRate / 100 / 12;
  const n = S.simCond.loanYears * 12;
  if (r === 0) return P / n;
  return P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
}

function calcRoomRevenue(rooms, isPetRoom, month, yearIdx) {
  let total = 0;
  const occGrowth = Math.pow(1 + S.simCond.occGrowth/100, yearIdx);
  const adrGrowth = Math.pow(1 + S.simCond.adrGrowth/100, yearIdx);
  const peak = isPeak(month);
  const pattern = isPetRoom ? OCC_PATTERN_PET[month] : OCC_PATTERN_GEN[month];
  for (const rm of rooms) {
    // ADR is per-room (2名1室・1泊2食付)
    const adr = (peak ? rm.peakADR : rm.normalADR) * adrGrowth;
    const baseOcc = peak ? rm.peakOcc : rm.normalOcc;
    const occ = Math.min(baseOcc * pattern * occGrowth, 1.0);
    total += rm.count * adr * occ * DAYS[month];
    // Pet 2nd animal fee: avg 0.3 heads × ¥3,300
    if (isPetRoom && rm.petFee) {
      total += rm.count * rm.petFee * adrGrowth * occ * DAYS[month];
    }
  }
  return total;
}

function calcWeightedOcc(rooms, month, yearIdx, pattern) {
  const occGrowth = Math.pow(1 + S.simCond.occGrowth/100, yearIdx);
  const peak = isPeak(month);
  let totalRN = 0, totalOccRN = 0;
  for (const rm of rooms) {
    const baseOcc = peak ? rm.peakOcc : rm.normalOcc;
    const occ = Math.min(baseOcc * pattern[month] * occGrowth, 1.0);
    totalRN += rm.count * DAYS[month];
    totalOccRN += rm.count * occ * DAYS[month];
  }
  return totalRN > 0 ? totalOccRN / totalRN : 0;
}

function calcAncillaryDetail(month, yearIdx) {
  // Meals are included in room rate (1泊2食付). Ancillary = drinks + pet options + shop
  const a = S.ancillary;
  const adrGrowth = Math.pow(1 + S.simCond.adrGrowth/100, yearIdx);
  const genOcc = calcWeightedOcc(S.generalRooms, month, yearIdx, OCC_PATTERN_GEN);
  const petOcc = calcWeightedOcc(S.petRooms, month, yearIdx, OCC_PATTERN_PET);
  const genCount = S.generalRooms.reduce((s,r)=>s+r.count,0);
  const petCount = S.petRooms.reduce((s,r)=>s+r.count,0);
  const genGuests = genCount * genOcc * a.avgGuestsGen * DAYS[month];
  const petGuests = petCount * petOcc * a.avgGuestsPet * DAYS[month];
  const totalGuests = genGuests + petGuests;
  // Drinks (alcohol/bar)
  const drinks = totalGuests * a.drinkOrderRate * a.drinkPrice * adrGrowth;
  // Pet options (premium plate + cake)
  const petRooms = petCount * petOcc * DAYS[month];
  const petOptions = petRooms * (a.petPremiumPlate * a.petPremiumRate + a.petCake * a.petCakeRate) * adrGrowth;
  // Shop & other
  const shop = a.shopMonthly * adrGrowth;
  const other = a.otherMonthly * adrGrowth;
  return { drinks, petOptions, shop, other, total: drinks + petOptions + shop + other, totalGuests, genGuests, petGuests };
}

function calcAncillaryRevenue(month, yearIdx) {
  const detail = calcAncillaryDetail(month, yearIdx);
  return {
    drinks: detail.drinks,
    petOptions: detail.petOptions,
    shop: detail.shop,
    other: detail.other,
    total: detail.total,
    totalGuests: detail.totalGuests,
    genGuests: detail.genGuests,
    petGuests: detail.petGuests
  };
}

function calcMonthlyExpenses(month, yearIdx, monthlyRoomRevenue, ancillary) {
  const e = S.expenses;
  const expGrowth = Math.pow(1 + S.simCond.expGrowth/100, yearIdx);
  const genOcc = calcWeightedOcc(S.generalRooms, month, yearIdx, OCC_PATTERN_GEN);
  const petOcc = calcWeightedOcc(S.petRooms, month, yearIdx, OCC_PATTERN_PET);
  const genCount = S.generalRooms.reduce((s,r)=>s+r.count,0);
  const petCount = S.petRooms.reduce((s,r)=>s+r.count,0);

  // Personnel
  let ftBase = 0;
  S.personnel.departments.forEach(d => { ftBase += d.ft * d.salary; });
  const ptTotal = S.personnel.departments.reduce((s,d)=>s+d.pt,0) * S.personnel.ptHourly * S.personnel.ptHours;
  const socialIns = ftBase * S.personnel.socialRate;
  const bonus = ftBase * S.personnel.bonusMonths / 12;
  const allowance = ftBase * S.personnel.allowanceRate;
  const personnel = (ftBase + ptTotal + socialIns + bonus + allowance) * expGrowth;

  // Variable: OTA commission on room revenue
  const commission = monthlyRoomRevenue * e.otaCommRate;

  // Variable: Food cost (per-guest, meals included in room rate)
  const totalGuests = ancillary.totalGuests || 0;
  const foodCost = totalGuests * e.foodCostPerGuest * expGrowth;

  // Variable: Beverage cost (on drink revenue)
  const bevCost = (ancillary.drinks || 0) * e.bevCostRate;

  // Variable: Linen (per room-night)
  const genLinenRN = genCount * genOcc * DAYS[month];
  const petLinenRN = petCount * petOcc * DAYS[month];
  const linen = (genLinenRN * e.linenUnitGen + petLinenRN * e.linenUnitPet) * expGrowth;

  // Variable: Amenity (per room-night)
  const amenityRN = (genLinenRN + petLinenRN) * e.amenityUnit;
  const amenity = amenityRN * expGrowth;

  // Fixed costs (monthly)
  const petRelated = e.petRelated * expGrowth;
  const utilities = e.utilities * expGrowth;
  const adMarketing = e.adMarketing * expGrowth;
  const repair = e.repair * expGrowth;
  const insuranceAll = e.insuranceAll * expGrowth;
  const generalFixed = e.generalFixed * expGrowth;
  const propertyTax = e.propertyTax * expGrowth;

  const fixed = petRelated + utilities + adMarketing + repair + insuranceAll + generalFixed + propertyTax;
  const total = personnel + commission + foodCost + bevCost + linen + amenity + fixed;

  return {
    personnel, commission, foodCost, bevCost, linen, amenity, fixed, total,
    categories: {
      '人件費': personnel,
      '食材費': foodCost,
      '飲料原価': bevCost,
      '集客手数料': commission,
      'リネン費': linen,
      'アメニティ費': amenity,
      '水光熱費': utilities,
      '固定資産税': propertyTax,
      '修繕・メンテナンス': repair,
      '広告・マーケティング': adMarketing,
      '保険': insuranceAll,
      'ペット関連': petRelated,
      'その他固定費': generalFixed
    }
  };
}

function runSimulation() {
  const years = S.simCond.years;
  const loan = calcMonthlyLoan();
  const results = { yearly:[], monthly:[] };

  for (let y = 0; y < years; y++) {
    let yearData = { genRevenue:0, petRevenue:0, ancRevenue:0, expenses:0, loanPayment:loan*12, months:[] };
    let yearExpCats = {};

    for (let m = 0; m < 12; m++) {
      const genRev = calcRoomRevenue(S.generalRooms, false, m, y);
      const petRev = calcRoomRevenue(S.petRooms, true, m, y);
      const roomRev = genRev + petRev;
      const anc = calcAncillaryRevenue(m, y);
      const exp = calcMonthlyExpenses(m, y, roomRev, anc);
      const totalRev = roomRev + anc.total;
      const net = totalRev - exp.total - loan;

      const mData = { month:m, genRevenue:genRev, petRevenue:petRev, roomRevenue:roomRev, ancRevenue:anc.total, totalRevenue:totalRev, expenses:exp.total, loanPayment:loan, net, expCats:exp.categories };
      yearData.months.push(mData);
      yearData.genRevenue += genRev;
      yearData.petRevenue += petRev;
      yearData.ancRevenue += anc.total;
      yearData.expenses += exp.total;

      for (const [k,v] of Object.entries(exp.categories)) {
        yearExpCats[k] = (yearExpCats[k]||0) + v;
      }
    }
    yearData.totalRevenue = yearData.genRevenue + yearData.petRevenue + yearData.ancRevenue;
    yearData.net = yearData.totalRevenue - yearData.expenses - yearData.loanPayment;
    yearData.expCats = yearExpCats;
    results.yearly.push(yearData);
  }
  return results;
}

function runScenario(preset) {
  const saved = JSON.parse(JSON.stringify(S));
  applyPresetToS(preset);
  const r = runSimulation();
  Object.assign(S, saved);
  return r;
}

function applyPresetToS(preset) {
  const mult = { optimistic:{ occ:1.167, adr:1.10 }, neutral:{ occ:1.0, adr:1.0 }, conservative:{ occ:0.833, adr:0.90 } };
  const m = mult[preset];
  S.generalRooms.forEach(r => {
    const def = DEFAULT.generalRooms.find(d=>d.id===r.id);
    r.normalOcc = Math.min(def.normalOcc * m.occ, 0.98);
    r.peakOcc = Math.min(def.peakOcc * m.occ, 0.98);
    r.normalADR = Math.round(def.normalADR * m.adr);
    r.peakADR = Math.round(def.peakADR * m.adr);
  });
  S.petRooms.forEach(r => {
    const def = DEFAULT.petRooms.find(d=>d.id===r.id);
    r.normalOcc = Math.min(def.normalOcc * m.occ, 0.98);
    r.peakOcc = Math.min(def.peakOcc * m.occ, 0.98);
    r.normalADR = Math.round(def.normalADR * m.adr);
    r.peakADR = Math.round(def.peakADR * m.adr);
  });
}

// ===== FORMATTING =====
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function fmtM(n) { return (n/10000).toFixed(0) + '万'; }
function fmtOku(n) { return (n/100000000).toFixed(2) + '億'; }
function pct(n) { return (n*100).toFixed(1) + '%'; }

// ===== RENDER KPI =====
function renderKPI(sim) {
  const y0 = sim.yearly[0];
  const genCount = S.generalRooms.reduce((s,r)=>s+r.count,0);
  const petCount = S.petRooms.reduce((s,r)=>s+r.count,0);
  const totalCount = genCount + petCount;
  const genRevPAR = Math.round(y0.genRevenue / (genCount * 365));
  const petRevPAR = Math.round(y0.petRevenue / (petCount * 365));
  const totalRevPAR = Math.round((y0.genRevenue + y0.petRevenue) / (totalCount * 365));
  const inv = S.simCond.totalInvestment;
  const netYield = ((y0.net / inv) * 100).toFixed(1);
  const payback = y0.net > 0 ? (inv / y0.net).toFixed(1) : '--';

  const kpis = [
    { label:'年間グロス収入', value:'&yen;' + fmt(y0.totalRevenue), sub:'客室+付帯収入', cls:'' },
    { label:'年間経費', value:'&yen;' + fmt(y0.expenses + y0.loanPayment), sub:'運営費+借入返済', cls:'orange' },
    { label:'年間Net利益', value:'&yen;' + fmt(y0.net), sub: y0.net >= 0 ? '黒字' : '赤字', cls: y0.net >= 0 ? 'green' : 'red' },
    { label:'Net利回り', value: netYield + '%', sub:'対投資額 ' + fmtOku(inv), cls: parseFloat(netYield) >= 0 ? 'green' : 'red' },
    { label:'一般客室 RevPAR', value:'&yen;' + fmt(genRevPAR), sub: genCount + '室', cls:'' },
    { label:'ペット客室 RevPAR', value:'&yen;' + fmt(petRevPAR), sub: petCount + '室', cls:'purple' },
    { label:'全体 RevPAR', value:'&yen;' + fmt(totalRevPAR), sub: totalCount + '室', cls:'' },
    { label:'投資回収期間', value: payback + '年', sub:'総投資額 ' + fmtOku(inv), cls: parseFloat(payback) <= 15 ? 'green' : 'orange' }
  ];

  document.getElementById('kpiGrid').innerHTML = kpis.map(k =>
    `<div class="kpi-card ${k.cls}"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub">${k.sub}</div></div>`
  ).join('');
}

// ===== RENDER SCENARIO TABLE =====
function renderScenarioTable() {
  const scenarios = ['optimistic','neutral','conservative'];
  const labels = ['楽観','中立','保守'];
  const sims = scenarios.map(preset => {
    const saved = JSON.parse(JSON.stringify(S));
    applyPresetToS(preset);
    const result = runSimulation();
    let gTot=0,gOcc=0,pTot=0,pOcc=0;
    for(let m=0;m<12;m++){
      const gc=S.generalRooms.reduce((a,r)=>a+r.count,0);
      const pc=S.petRooms.reduce((a,r)=>a+r.count,0);
      const go=calcWeightedOcc(S.generalRooms,m,0,OCC_PATTERN_GEN);
      const po=calcWeightedOcc(S.petRooms,m,0,OCC_PATTERN_PET);
      gTot+=gc*DAYS[m]; gOcc+=gc*go*DAYS[m];
      pTot+=pc*DAYS[m]; pOcc+=pc*po*DAYS[m];
    }
    result.annualGenOcc = gTot>0 ? gOcc/gTot : 0;
    result.annualPetOcc = pTot>0 ? pOcc/pTot : 0;
    Object.assign(S, saved);
    return result;
  });

  const rows = [
    { label:'一般客室稼働率', fn: (s,i) => pct(s.annualGenOcc) },
    { label:'ペット客室稼働率', fn: (s,i) => pct(s.annualPetOcc) },
    { label:'年間売上', fn: s => '&yen;' + fmt(s.yearly[0].totalRevenue) },
    { label:'  うち客室収入', fn: s => '&yen;' + fmt(s.yearly[0].genRevenue + s.yearly[0].petRevenue) },
    { label:'  うち付帯収入', fn: s => '&yen;' + fmt(s.yearly[0].ancRevenue) },
    { label:'年間経費（返済込）', fn: s => '&yen;' + fmt(s.yearly[0].expenses + s.yearly[0].loanPayment) },
    { label:'年間Net利益', fn: s => { const n=s.yearly[0].net; return `<span class="${n>=0?'positive':'negative'}">&yen;${fmt(n)}</span>`; } },
    { label:'Net利回り', fn: s => { const r=(s.yearly[0].net/S.simCond.totalInvestment*100); return `<span class="${r>=0?'positive':'negative'}">${r.toFixed(1)}%</span>`; } },
    { label:'投資回収期間', fn: s => { const n=s.yearly[0].net; return n>0?(S.simCond.totalInvestment/n).toFixed(1)+'年':'--'; } },
    { label:'10年累積利益', fn: s => { const t=s.yearly.reduce((a,y)=>a+y.net,0); return `<span class="${t>=0?'positive':'negative'}">&yen;${fmt(t)}</span>`; } }
  ];

  let html = '<thead><tr><th></th>';
  labels.forEach(l => html += `<th>${l}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += `<tr><td>${row.label}</td>`;
    sims.forEach((s,i) => html += `<td>${row.fn(s,i)}</td>`);
    html += '</tr>';
  });
  html += '</tbody>';
  document.getElementById('scenarioTable').innerHTML = html;
}

  allRooms.forEach(r => {

      <div class="form-group"><label class="form-label">繁忙期ADR</label><input class="form-input" type="number" data-pr="${i}" data-field="peakADR" value="${r.peakADR}"></div>
      <div class="form-group"><label class="form-label">通常期稼働率</label><input class="form-input" type="number" step="0.01" data-pr="${i}" data-field="normalOcc" value="${r.normalOcc}"></div>
      <div class="form-group"><label class="form-label">繁忙期稼働率</label><input class="form-input" type="number" step="0.01" data-pr="${i}" data-field="peakOcc" value="${r.peakOcc}"></div>
    </div></div>`;
  });
  rhtml += '</div></div>';
  document.getElementById('stab-rooms').innerHTML = rhtml;

  // Ancillary (meals included in room rate; ancillary = drinks + pet options + shop)
  const a = S.ancillary;
  let ahtml = '<div class="form-section"><div class="form-section-title">飲料売上（アルコール・バー）</div><div class="form-row">';
  ahtml += `<div class="form-group"><label class="form-label">注文率</label><input class="form-input" type="number" step="0.01" data-anc="drinkOrderRate" value="${a.drinkOrderRate}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">平均客単価</label><input class="form-input" type="number" data-anc="drinkPrice" value="${a.drinkPrice}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">一般客 平均人数</label><input class="form-input" type="number" step="0.1" data-anc="avgGuestsGen" value="${a.avgGuestsGen}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">ペット客 平均人数</label><input class="form-input" type="number" step="0.1" data-anc="avgGuestsPet" value="${a.avgGuestsPet}"></div>`;
  ahtml += '</div></div>';
  ahtml += '<div class="form-section"><div class="form-section-title">ペットオプション</div><div class="form-row">';
  ahtml += `<div class="form-group"><label class="form-label">プレミアムプレート単価</label><input class="form-input" type="number" data-anc="petPremiumPlate" value="${a.petPremiumPlate}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">注文率</label><input class="form-input" type="number" step="0.01" data-anc="petPremiumRate" value="${a.petPremiumRate}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">記念日ケーキ単価</label><input class="form-input" type="number" data-anc="petCake" value="${a.petCake}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">ケーキ注文率</label><input class="form-input" type="number" step="0.01" data-anc="petCakeRate" value="${a.petCakeRate}"></div>`;
  ahtml += '</div></div>';
  ahtml += '<div class="form-section"><div class="form-section-title">その他</div><div class="form-row">';
  ahtml += `<div class="form-group"><label class="form-label">売店収入(月額)</label><input class="form-input" type="number" data-anc="shopMonthly" value="${a.shopMonthly}"></div>`;
  ahtml += `<div class="form-group"><label class="form-label">その他(月額)</label><input class="form-input" type="number" data-anc="otherMonthly" value="${a.otherMonthly}"></div>`;
  ahtml += '</div></div>';
  document.getElementById('stab-ancillary').innerHTML = ahtml;

  // Expenses
  const ex = S.expenses;
  const expItems = [
    ['食材費/人泊(円)','foodCostPerGuest'],['飲料原価率','bevCostRate'],
    ['リネン単価(一般/室泊)','linenUnitGen'],['リネン単価(ペット/室泊)','linenUnitPet'],
    ['アメニティ単価/室泊','amenityUnit'],
    ['OTA手数料率','otaCommRate'],
    ['ペット関連(月額)','petRelated'],
    ['水光熱費(月額)','utilities'],
    ['広告・マーケティング(月額)','adMarketing'],
    ['修繕・メンテナンス(月額)','repair'],
    ['保険(月額)','insuranceAll'],
    ['その他固定費(月額)','generalFixed'],
    ['固定資産税(月額)','propertyTax']
  ];
  let ehtml = '<table class="expense-table"><thead><tr><th>経費項目</th><th>金額 / 率</th></tr></thead><tbody>';
  expItems.forEach(([label,key]) => {
    const isRate = key.includes('Rate');
    const step = isRate ? '0.01' : '1000';
    ehtml += `<tr><td>${label}</td><td><input class="form-input" type="number" step="${step}" data-exp="${key}" value="${ex[key]}"></td></tr>`;
  });
  ehtml += '</tbody></table>';
  document.getElementById('stab-expenses').innerHTML = ehtml;

  // Personnel
  let phtml = '<div class="form-section"><div class="form-section-title">部門別人員配置</div>';
  phtml += '<table class="expense-table"><thead><tr><th>部門</th><th>正社員</th><th>パート</th><th>正社員月給</th></tr></thead><tbody>';
  S.personnel.departments.forEach((d,i) => {
    phtml += `<tr><td>${d.name}</td><td><input class="form-input" type="number" data-dept="${i}" data-df="ft" value="${d.ft}" style="width:60px"></td><td><input class="form-input" type="number" data-dept="${i}" data-df="pt" value="${d.pt}" style="width:60px"></td><td><input class="form-input" type="number" data-dept="${i}" data-df="salary" value="${d.salary}" style="width:100px"></td></tr>`;
  });
  phtml += '</tbody></table></div>';
  phtml += '<div class="form-section"><div class="form-section-title">共通設定</div><div class="form-row">';
  phtml += `<div class="form-group"><label class="form-label">パート時給</label><input class="form-input" type="number" data-pers="ptHourly" value="${S.personnel.ptHourly}"></div>`;
  phtml += `<div class="form-group"><label class="form-label">パート月間時間</label><input class="form-input" type="number" data-pers="ptHours" value="${S.personnel.ptHours}"></div>`;
  phtml += `<div class="form-group"><label class="form-label">社会保険料率</label><input class="form-input" type="number" step="0.01" data-pers="socialRate" value="${S.personnel.socialRate}"></div>`;
  phtml += `<div class="form-group"><label class="form-label">賞与月数</label><input class="form-input" type="number" step="0.1" data-pers="bonusMonths" value="${S.personnel.bonusMonths}"></div>`;
  phtml += `<div class="form-group"><label class="form-label">手当率</label><input class="form-input" type="number" step="0.001" data-pers="allowanceRate" value="${S.personnel.allowanceRate}"></div>`;
  phtml += '</div></div>';
  document.getElementById('stab-personnel').innerHTML = phtml;

  // Simulation Conditions
  let shtml = '<div class="form-row">';
  shtml += `<div class="form-group"><label class="form-label">シミュレーション期間（年）</label><input class="form-input" type="number" data-sim="years" value="${S.simCond.years}" min="1" max="20"></div>`;
  shtml += `<div class="form-group"><label class="form-label">総投資額</label><input class="form-input" type="number" data-sim="totalInvestment" value="${S.simCond.totalInvestment}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">借入金額</label><input class="form-input" type="number" data-sim="loanAmount" value="${S.simCond.loanAmount}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">金利(%)</label><input class="form-input" type="number" step="0.1" data-sim="loanRate" value="${S.simCond.loanRate}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">返済期間（年）</label><input class="form-input" type="number" data-sim="loanYears" value="${S.simCond.loanYears}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">稼働率年次成長率(%)</label><input class="form-input" type="number" step="0.1" data-sim="occGrowth" value="${S.simCond.occGrowth}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">単価年次成長率(%)</label><input class="form-input" type="number" step="0.1" data-sim="adrGrowth" value="${S.simCond.adrGrowth}"></div>`;
  shtml += `<div class="form-group"><label class="form-label">経費年次成長率(%)</label><input class="form-input" type="number" step="0.1" data-sim="expGrowth" value="${S.simCond.expGrowth}"></div>`;
  shtml += '</div>';
  shtml += '<div class="form-section" style="margin-top:16px"><div class="form-section-title">繁忙期月設定</div><div class="checkbox-grid">';
  for (let m = 1; m <= 12; m++) {
    const checked = S.simCond.peakMonths.includes(m) ? 'checked' : '';
    shtml += `<label class="checkbox-label"><input type="checkbox" data-peak="${m}" ${checked}>${m}月</label>`;
  }
  shtml += '</div></div>';
  document.getElementById('stab-simcond').innerHTML = shtml;
}

function applySettings() {
  // Read room settings
  document.querySelectorAll('[data-gr]').forEach(el => {
    const i = parseInt(el.dataset.gr);
    const f = el.dataset.field;
    S.generalRooms[i][f] = parseFloat(el.value);
  });
  document.querySelectorAll('[data-pr]').forEach(el => {
    const i = parseInt(el.dataset.pr);
    const f = el.dataset.field;
    S.petRooms[i][f] = parseFloat(el.value);
  });

  // Bulk adjust
  const bulkOcc = parseFloat(document.getElementById('bulkOccAll')?.value || 100) / 100;
  const bulkNormal = parseFloat(document.getElementById('bulkADRNormal')?.value || 100) / 100;
  const bulkPeak = parseFloat(document.getElementById('bulkADRPeak')?.value || 100) / 100;
  if (bulkOcc !== 1) {
    S.generalRooms.forEach(r => { r.normalOcc = Math.min(r.normalOcc * bulkOcc, 0.98); r.peakOcc = Math.min(r.peakOcc * bulkOcc, 0.98); });
    S.petRooms.forEach(r => { r.normalOcc = Math.min(r.normalOcc * bulkOcc, 0.98); r.peakOcc = Math.min(r.peakOcc * bulkOcc, 0.98); });
  }
  if (bulkNormal !== 1) {
    S.generalRooms.forEach(r => { r.normalADR = Math.round(r.normalADR * bulkNormal); });
    S.petRooms.forEach(r => { r.normalADR = Math.round(r.normalADR * bulkNormal); });
  }
  if (bulkPeak !== 1) {
    S.generalRooms.forEach(r => { r.peakADR = Math.round(r.peakADR * bulkPeak); });
    S.petRooms.forEach(r => { r.peakADR = Math.round(r.peakADR * bulkPeak); });
  }

  // Ancillary
  document.querySelectorAll('[data-anc]').forEach(el => {
    S.ancillary[el.dataset.anc] = parseFloat(el.value);
  });

  // Expenses
  document.querySelectorAll('[data-exp]').forEach(el => {
    S.expenses[el.dataset.exp] = parseFloat(el.value);
  });

  // Personnel
  document.querySelectorAll('[data-dept]').forEach(el => {
    const i = parseInt(el.dataset.dept);
    S.personnel.departments[i][el.dataset.df] = parseFloat(el.value);
  });
  document.querySelectorAll('[data-pers]').forEach(el => {
    S.personnel[el.dataset.pers] = parseFloat(el.value);
  });

  // Sim conditions
  document.querySelectorAll('[data-sim]').forEach(el => {
    S.simCond[el.dataset.sim] = parseFloat(el.value);
  });
  S.simCond.peakMonths = [];
  document.querySelectorAll('[data-peak]').forEach(el => {
    if (el.checked) S.simCond.peakMonths.push(parseInt(el.dataset.peak));
  });

  closeSettings();
  update();
}

// ===== PRESETS =====
function applyPreset(preset) {
  S = JSON.parse(JSON.stringify(DEFAULT));
  applyPresetToS(preset);
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn-preset[onclick*="${preset}"]`).classList.add('active');
  update();
}

// ===== TABS =====
document.addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    const parent = e.target.closest('.tabs') || e.target.parentElement;
    parent.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const tabId = e.target.dataset.tab;
    if (tabId) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.getElementById('tab-' + tabId)?.classList.add('active');
    }
  }
  if (e.target.classList.contains('settings-tab')) {
    const parent = e.target.parentElement;
    parent.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const stab = e.target.dataset.stab;
    document.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('stab-' + stab)?.classList.add('active');
  }
});

// ===== MAIN UPDATE =====
function update() {
  try {
    const sim = runSimulation();
    renderKPI(sim);
    renderScenarioTable();
    renderCharts(sim);
    renderPLTable(sim);
    renderRevPARTable();
    renderMonthlyDetail();
  } catch(err) {
    console.error('Simulation error:', err);
  }
}

// Initialize
update();
</script>
